<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы — SMS Light</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=11">
  <style>
    .page-reviews { padding: 60px 0; max-width: 800px; margin: 0 auto; }
    .page-reviews h1 { font-size: 28px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .page-reviews__sub { font-size: 14px; color: var(--gray-500); margin-bottom: 24px; }

    /* Stats bar */
    .reviews-stats {
      display: flex; align-items: center; gap: 24px;
      padding: 20px 24px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .reviews-stats__big {
      font-size: 36px; font-weight: 800; color: var(--white);
      line-height: 1;
    }
    .reviews-stats__stars {
      color: #10b981; font-size: 18px; letter-spacing: 2px;
    }
    .reviews-stats__label {
      font-size: 13px; color: var(--gray-500);
    }
    .reviews-stats__divider {
      width: 1px; height: 40px; background: var(--gray-800);
    }
    .reviews-stats__count {
      font-size: 14px; color: var(--gray-400);
    }

    /* Filter chips */
    .reviews-filters {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 24px;
    }
    .reviews-filters button {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--gray-800);
      background: var(--gray-900);
      color: var(--gray-400);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .reviews-filters button:hover {
      border-color: var(--gray-700);
      color: var(--gray-200);
    }
    .reviews-filters button.active {
      border-color: var(--green-500);
      background: rgba(16,185,129,0.12);
      color: var(--green-400);
    }

    /* Review card */
    .review-card {
      padding: 20px 24px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: 12px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .review-card:hover {
      border-color: var(--gray-700);
    }
    .review-card__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .review-card__author {
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
    }
    .review-card__rating {
      color: #10b981;
      font-size: 15px;
      letter-spacing: 1px;
    }
    .review-card__rating .star--filled { color: #10b981; }
    .review-card__rating .star--empty { color: #444; opacity: 0.5; }
    .review-card__service {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      background: rgba(16,185,129,0.12);
      color: var(--green-400);
      margin-bottom: 8px;
    }
    .review-card__text {
      font-size: 14px;
      color: var(--gray-400);
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .review-card__date {
      font-size: 12px;
      color: var(--gray-600);
    }

    /* Light theme */
    [data-theme="light"] .review-card {
      background: var(--white);
      border-color: var(--gray-200);
    }
    [data-theme="light"] .review-card:hover {
      border-color: var(--gray-300);
    }
    [data-theme="light"] .reviews-stats {
      background: var(--gray-100);
      border-color: var(--gray-200);
    }
    [data-theme="light"] .reviews-stats__divider {
      background: var(--gray-300);
    }
    [data-theme="light"] .reviews-filters button {
      background: var(--white);
      border-color: var(--gray-300);
      color: var(--gray-600);
    }
    [data-theme="light"] .reviews-filters button.active {
      background: rgba(16,185,129,0.1);
      border-color: var(--green);
    }

    .show-more-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 32px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--gray-800);
      background: var(--gray-900);
      color: var(--gray-300);
      cursor: pointer;
    }
    .show-more-btn:hover {
      border-color: var(--green);
      color: var(--green-text);
      background: rgba(16,185,129,0.05);
    }
    [data-theme="light"] .show-more-btn {
      background: var(--white);
      border-color: var(--gray-300);
    }
    [data-theme="light"] .show-more-btn:hover {
      border-color: var(--green);
    }
  </style>
</head>
<body>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <span class="logo__text">SMS<span class="logo__accent">Light</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="index.html#services" class="nav__link">Услуги</a>
        <a href="faq.html" class="nav__link">FAQ</a>
        <a href="reviews.html" class="nav__link nav__link--active">Отзывы</a>
        <a href="#" class="nav__link" onclick="Profile.openChat();return false">Чат</a>
        <span id="navAuth">
          <a href="login.html" class="nav__link nav__link--login">Войти</a>
          <a href="register.html" class="btn btn--sm">Регистрация</a>
        </span>
      </nav>
      <div class="header__actions">
        <a href="https://t.me/REXNCER" target="_blank" rel="noopener" class="telegram-btn" aria-label="Написать в Telegram" title="Написать в Telegram">
          <svg width="17" height="17" viewBox="0 0 496 512" fill="currentColor"><path d="M248 8C111 8 0 119 0 256s111 248 248 248 248-111 248-248S385 8 248 8zm121.8 169.9l-40.7 191.8c-3 13.6-11.1 16.9-22.4 10.5l-62-45.7-29.9 28.8c-3.3 3.3-6.1 6.1-12.5 6.1l4.4-63.1 114.9-103.8c5-4.4-1.1-6.9-7.7-2.5l-142 89.4-61.2-19.1c-13.3-4.2-13.6-13.3 2.8-19.7l239.1-92.2c11.1-4 20.8 2.7 17.2 19.5z"/></svg>
        </a>
        <button class="theme-toggle" id="themeToggle" onclick="Auth.toggleTheme()" aria-label="Сменить тему">
          <svg class="theme-toggle__sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="theme-toggle__moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="burger" id="burger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="container page-reviews">
      <h1 style="animation: fadeUp 0.5s ease both;">Отзывы наших клиентов</h1>
      <p class="page-reviews__sub" style="animation: fadeUp 0.5s ease 0.05s both;">Реальные отзывы реальных людей</p>

      <div class="reviews-stats" id="reviewsStats" style="animation: fadeUp 0.5s ease 0.1s both;"></div>
      <div class="reviews-filters" id="reviewsFilters" style="animation: fadeUp 0.5s ease 0.15s both;"></div>
      <div id="reviewsList"></div>
      <button class="show-more-btn" id="showMoreBtn" style="display:none" onclick="showMore()">Показать ещё</button>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/chat-server.js"></script>
  <script src="js/profile.js"></script>
  <script>
    var currentFilter = 0;
    var visibleCount = 10;
    var PER_PAGE = 10;

    function getFiltered() {
      var all = Data.getReviews();
      if (currentFilter > 0) {
        all = all.filter(function(r) { return r.rating === currentFilter; });
      }
      return all;
    }

    function renderStars(rating) {
      var s = '';
      for (var i = 0; i < 5; i++) {
        s += i < rating ? '<span class="star--filled">★</span>' : '<span class="star--empty">☆</span>';
      }
      return s;
    }

    function renderStats() {
      var all = Data.getReviews();
      var total = all.length;
      var sum = 0;
      for (var i = 0; i < total; i++) sum += all[i].rating;
      var avg = (sum / total).toFixed(1);

      var dist = [0,0,0,0,0];
      for (var i = 0; i < total; i++) {
        dist[5 - all[i].rating]++;
      }

      var el = document.getElementById('reviewsStats');
      if (!el) return;
      el.innerHTML =
        '<div class="reviews-stats__big">' + avg + '</div>' +
        '<div>' +
          '<div class="reviews-stats__stars">' + renderStars(Math.round(avg)) + '</div>' +
          '<div class="reviews-stats__label">средняя оценка</div>' +
        '</div>' +
        '<div class="reviews-stats__divider"></div>' +
        '<div class="reviews-stats__count">' + total + ' отзывов</div>';
    }

    function renderFilters() {
      var el = document.getElementById('reviewsFilters');
      if (!el) return;
      var chips = [{ label: 'Все', val: 0 }, { label: '5 ★', val: 5 }, { label: '4 ★', val: 4 }];
      var html = '';
      for (var i = 0; i < chips.length; i++) {
        html += '<button class="' + (currentFilter === chips[i].val ? 'active' : '') + '" onclick="setFilter(' + chips[i].val + ')">' + chips[i].label + '</button>';
      }
      el.innerHTML = html;
    }

    function renderReviews() {
      var filtered = getFiltered();
      var show = filtered.slice(0, visibleCount);

      var el = document.getElementById('reviewsList');
      if (!el) return;

      if (show.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--gray-500);font-size:14px">Нет отзывов с таким рейтингом</div>';
        document.getElementById('showMoreBtn').style.display = 'none';
        return;
      }

      var html = '';
      for (var i = 0; i < show.length; i++) {
        var r = show[i];
        html += '<div class="review-card" style="animation: fadeUp 0.3s ease ' + (i * 0.04) + 's both;">' +
          '<div class="review-card__top">' +
            '<span class="review-card__author">' + esc(r.author) + '</span>' +
            '<span class="review-card__rating">' + renderStars(r.rating) + '</span>' +
          '</div>' +
          '<div class="review-card__service">' + esc(r.service) + '</div>' +
          '<div class="review-card__text">' + esc(r.text) + '</div>' +
          '<div class="review-card__date">' + r.date + '</div>' +
        '</div>';
      }
      el.innerHTML = html;

      var moreBtn = document.getElementById('showMoreBtn');
      if (visibleCount < filtered.length) {
        moreBtn.style.display = 'block';
      } else {
        moreBtn.style.display = 'none';
      }
    }

    function setFilter(val) {
      currentFilter = val;
      visibleCount = PER_PAGE;
      renderFilters();
      renderReviews();
    }

    function showMore() {
      visibleCount += PER_PAGE;
      renderReviews();
    }

    function esc(str) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    // Init
    renderStats();
    renderFilters();
    renderReviews();

    // Подгрузить отзывы покупателей с сервера и перерисовать (статистика + список)
    if (typeof Data.fetchServerReviews === 'function') {
      Data.fetchServerReviews(function() {
        renderStats();
        renderReviews();
      });
    }

    // Update nav auth
    Auth.applyTheme();
    function navReady() { Auth.updateNav(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', navReady);
    } else {
      navReady();
    }

    // Синхронизация чата (если авторизован)
    var rvSession = Auth.getSession();
    if (rvSession) { Auth.syncUsers(); ChatServer.startSync(); }
  </script>
</body>
</html>
