<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" style="font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a16"/>
      <stop offset="0.55" stop-color="#08100d"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="500" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(16,185,129,0.22)"/>
      <stop offset="0.6" stop-color="rgba(16,185,129,0.08)"/>
      <stop offset="1" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2623"/>
      <stop offset="1" stop-color="#0a0e0d"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="rgba(16,185,129,0.045)" stroke-width="1.5"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="512" cy="500" r="420" fill="url(#glow)"/>

  <!-- Радар-орбита за роботом (пунктирное кольцо + сателлит) -->
  <circle cx="512" cy="512" r="252" fill="none" stroke="rgba(52,211,153,0.16)" stroke-width="3" stroke-dasharray="14 30"/>
  <circle cx="512" cy="260" r="11" fill="#34d399" opacity="0.8"/>

  <!-- Антенна -->
  <line x1="512" y1="336" x2="512" y2="256" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
  <circle cx="512" cy="238" r="30" fill="none" stroke="rgba(52,211,153,0.4)" stroke-width="3"/>
  <circle cx="512" cy="238" r="17" fill="#34d399"/>

  <!-- Лапки-руки по бокам головы -->
  <circle cx="312" cy="478" r="27" fill="url(#bodyGrad)" stroke="rgba(52,211,153,0.45)" stroke-width="3.5"/>
  <circle cx="712" cy="478" r="27" fill="url(#bodyGrad)" stroke="rgba(52,211,153,0.45)" stroke-width="3.5"/>
  <circle cx="312" cy="478" r="9" fill="#34d399" opacity="0.7"/>
  <circle cx="712" cy="478" r="9" fill="#34d399" opacity="0.7"/>

  <!-- Голова робота -->
  <rect x="352" y="336" width="320" height="288" rx="58" fill="url(#bodyGrad)" stroke="rgba(52,211,153,0.42)" stroke-width="3.5"/>

  <!-- Индикаторы на лбу -->
  <circle cx="446" cy="372" r="5" fill="#34d399" opacity="0.55"/>
  <circle cx="512" cy="372" r="5" fill="#34d399"/>
  <circle cx="578" cy="372" r="5" fill="#34d399" opacity="0.55"/>

  <!-- Визор-экран -->
  <rect x="404" y="400" width="216" height="160" rx="32" fill="#0a0e0d" stroke="rgba(52,211,153,0.5)" stroke-width="3"/>
  <!-- блик на стекле визора -->
  <path d="M 420 400 L 470 400 L 420 436 Z" fill="rgba(52,211,153,0.14)"/>

  <!-- Глаза -->
  <circle cx="454" cy="464" r="14" fill="#34d399"/>
  <circle cx="570" cy="464" r="14" fill="#34d399"/>
  <circle cx="450" cy="460" r="4.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="566" cy="460" r="4.5" fill="#ffffff" opacity="0.55"/>

  <!-- Щёки -->
  <circle cx="424" cy="506" r="13" fill="#34d399" opacity="0.16"/>
  <circle cx="600" cy="506" r="13" fill="#34d399" opacity="0.16"/>

  <!-- Улыбка -->
  <path d="M 472 508 Q 512 532 552 508" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round"/>

  <!-- Панель-динамик -->
  <rect x="424" y="588" width="176" height="26" rx="13" fill="rgba(16,185,129,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="2"/>
  <circle cx="512" cy="601" r="6" fill="#34d399" opacity="0.85"/>

  <!-- Пузырь «4 · 2 · 1» (летит из головы) -->
  <g>
    <path d="M 656 330 q -22 20 -34 30 l 30 -8 z" fill="#0e1613"/>
    <rect x="650" y="248" width="168" height="72" rx="36" fill="#0e1613" stroke="rgba(52,211,153,0.6)" stroke-width="3.5"/>
    <text x="734" y="296" font-size="27" font-weight="800" letter-spacing="5" fill="#6ee7b7" text-anchor="middle">4·2·1</text>
  </g>

  <!-- Пузырь «✓ Номер готов» -->
  <g>
    <path d="M 362 596 q 20 14 34 20 l -32 -10 z" fill="#0e1613"/>
    <rect x="196" y="566" width="190" height="54" rx="27" fill="#0e1613" stroke="rgba(52,211,153,0.42)" stroke-width="3"/>
    <text x="291" y="600" font-size="21" font-weight="600" fill="#34d399" text-anchor="middle">✓ Номер готов</text>
  </g>

  <!-- Частицы -->
  <g fill="#34d399">
    <circle cx="150" cy="176" r="7" opacity="0.4"/>
    <circle cx="872" cy="210" r="5" opacity="0.35"/>
    <circle cx="908" cy="830" r="6" opacity="0.35"/>
    <circle cx="132" cy="810" r="5" opacity="0.3"/>
    <circle cx="512" cy="120" r="4" opacity="0.3"/>
    <circle cx="960" cy="512" r="4" opacity="0.3"/>
    <circle cx="64" cy="500" r="4" opacity="0.25"/>
  </g>
</svg>
