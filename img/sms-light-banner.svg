<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-label="SMS Light — виртуальные номера для регистрации">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d10"/>
      <stop offset=".55" stop-color="#0b1518"/>
      <stop offset="1" stop-color="#04140f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1519"/>
      <stop offset="1" stop-color="#101d18"/>
    </linearGradient>
    <radialGradient id="orb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#10b981" stop-opacity=".30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".20"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset=".5" stop-color="#10b981" stop-opacity=".5"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Фон -->
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <!-- Светящиеся сферы -->
  <circle cx="1230" cy="70" r="320" fill="url(#orb1)"/>
  <circle cx="170" cy="480" r="290" fill="url(#orb2)"/>
  <circle cx="1490" cy="470" r="250" fill="url(#orb1)"/>

  <!-- Мерцающие частицы -->
  <g fill="#10b981">
    <circle cx="90" cy="120" r="2.5" opacity=".5"><animate attributeName="opacity" values=".2;.8;.2" dur="3.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="2" opacity=".6"><animate attributeName="opacity" values=".3;1;.3" dur="4.1s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="470" r="3" opacity=".4"><animate attributeName="opacity" values=".15;.7;.15" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="150" r="2" opacity=".5"><animate attributeName="opacity" values=".2;.9;.2" dur="4.6s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="200" r="2" opacity=".4"><animate attributeName="opacity" values=".25;.8;.25" dur="3.1s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="340" r="2.5" opacity=".5"><animate attributeName="opacity" values=".2;.7;.2" dur="3.9s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="120" r="1.8" opacity=".5"><animate attributeName="opacity" values=".3;.9;.3" dur="4.4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1390" cy="500" r="2.2" opacity=".4"><animate attributeName="opacity" values=".2;.8;.2" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0ea5e9">
    <circle cx="700" cy="300" r="2" opacity=".4"><animate attributeName="opacity" values=".2;.7;.2" dur="4.2s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="220" r="1.8" opacity=".4"><animate attributeName="opacity" values=".25;.8;.25" dur="3.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="450" r="2.4" opacity=".5"><animate attributeName="opacity" values=".2;.9;.2" dur="4.7s" begin=".7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Левая часть: название и описание ===== -->
  <g font-family="'Inter','Segoe UI',Arial,sans-serif">
    <!-- Бейдж -->
    <rect x="100" y="138" width="322" height="46" rx="23" fill="#10b981" opacity=".12" stroke="#10b981" stroke-opacity=".4"/>
    <circle cx="129" cy="161" r="6" fill="#34d399">
      <animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="167" font-size="20" font-weight="600" letter-spacing=".3" fill="#a7f3d0">Виртуальные номера</text>

    <!-- Название -->
    <text x="96" y="258" font-size="118" font-weight="800" letter-spacing="-3">
      <tspan fill="#ffffff">SMS </tspan>
      <tspan fill="url(#accent)">Light</tspan>
    </text>

    <!-- Описание -->
    <text x="100" y="318" font-size="27" font-weight="400" fill="#9aa7a8">Регистрация в Telegram, WhatsApp</text>
    <text x="100" y="354" font-size="27" font-weight="400" fill="#9aa7a8">и ещё 200+ сервисах.</text>

    <!-- Плюшки-преимущества -->
    <g font-size="19" font-weight="600" letter-spacing=".2">
      <rect x="100" y="394" width="208" height="54" rx="27" fill="url(#chip)"/>
      <text x="204" y="428" text-anchor="middle" fill="#04140f">⚡ Моментально</text>
      <rect x="326" y="394" width="196" height="54" rx="27" fill="#162129" stroke="#2a3a3d"/>
      <text x="424" y="428" text-anchor="middle" fill="#d1fae5">🛡️ Анонимно</text>
      <rect x="540" y="394" width="188" height="54" rx="27" fill="#162129" stroke="#2a3a3d"/>
      <text x="634" y="428" text-anchor="middle" fill="#d1fae5">🌍 30+ стран</text>
    </g>
  </g>

  <!-- ===== Правая часть: телефон с чатом ===== -->
  <!-- Зелёная аура за телефоном -->
  <rect x="1005" y="28" width="350" height="484" rx="56" fill="#10b981" opacity=".08" filter="url(#soft)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="6s" repeatCount="indefinite"/>

    <!-- Волны сигнала -->
    <g fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round">
      <path d="M1356 96 A34 34 0 0 1 1390 62" opacity=".55"><animate attributeName="opacity" values=".6;.15;.6" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M1344 108 A46 46 0 0 1 1402 50" opacity=".35"><animate attributeName="opacity" values=".35;.1;.35" dur="2.6s" begin=".3s" repeatCount="indefinite"/></path>
      <path d="M1332 120 A58 58 0 0 1 1414 38" opacity=".18"><animate attributeName="opacity" values=".2;.05;.2" dur="2.6s" begin=".6s" repeatCount="indefinite"/></path>
    </g>

    <!-- Корпус телефона -->
    <rect x="1016" y="40" width="330" height="460" rx="46" fill="#10191c" stroke="#223138" stroke-width="2"/>
    <rect x="1028" y="52" width="306" height="436" rx="34" fill="url(#screen)" stroke="#223138" stroke-width="1.5"/>

    <!-- Чёлка -->
    <rect x="1132" y="64" width="98" height="18" rx="9" fill="#05080a"/>

    <!-- Шапка приложения -->
    <text x="1052" y="112" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#e5e5e5">SMS<tspan fill="#34d399">Light</tspan></text>
    <rect x="1186" y="94" width="92" height="24" rx="12" fill="#10b981" opacity=".15"/>
    <circle cx="1201" cy="106" r="4.5" fill="#34d399"><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="1212" y="111" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="13" fill="#6ee7b7">Онлайн</text>

    <!-- Входящее: номер готов -->
    <rect x="1045" y="132" width="268" height="44" rx="16" fill="#162129"/>
    <text x="1060" y="159" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="15" fill="#d1d9dc">Номер готов: +7 999 123-45-67</text>

    <!-- Входящее: ожидание кода -->
    <rect x="1045" y="186" width="212" height="44" rx="16" fill="#162129"/>
    <text x="1060" y="213" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="15" fill="#d1d9dc">Ожидаем SMS с кодом…</text>

    <!-- Блок кода -->
    <rect x="1045" y="240" width="234" height="66" rx="18" fill="#10b981" opacity=".14" stroke="#10b981" stroke-opacity=".35"/>
    <g font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700">
      <rect x="1063" y="252" width="36" height="42" rx="8" fill="#0d1a16" stroke="#10b981" stroke-opacity=".6"/>
      <text x="1081" y="281" text-anchor="middle" fill="#6ee7b7">4</text>
      <rect x="1109" y="252" width="36" height="42" rx="8" fill="#0d1a16" stroke="#10b981" stroke-opacity=".6"/>
      <text x="1127" y="281" text-anchor="middle" fill="#6ee7b7">3</text>
      <rect x="1155" y="252" width="36" height="42" rx="8" fill="#0d1a16" stroke="#10b981" stroke-opacity=".6"/>
      <text x="1173" y="281" text-anchor="middle" fill="#6ee7b7">2</text>
      <rect x="1201" y="252" width="36" height="42" rx="8" fill="#0d1a16" stroke="#10b981" stroke-opacity=".6"/>
      <text x="1219" y="281" text-anchor="middle" fill="#6ee7b7">1</text>
    </g>

    <!-- Печать сообщения -->
    <rect x="1045" y="318" width="78" height="42" rx="16" fill="#162129"/>
    <g fill="#6ee7b7">
      <circle cx="1065" cy="339" r="4"><animate attributeName="cy" values="339;335;339" dur="1s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="1079" cy="339" r="4"><animate attributeName="cy" values="339;335;339" dur="1s" begin=".15s" repeatCount="indefinite"/></circle>
      <circle cx="1093" cy="339" r="4"><animate attributeName="cy" values="339;335;339" dur="1s" begin=".3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Исходящее: код получен -->
    <rect x="1106" y="374" width="208" height="44" rx="16" fill="#10b981"/>
    <text x="1210" y="401" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#04140f">Готово! Код получен ✅</text>

    <!-- Низ экрана -->
    <text x="1181" y="470" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="16" fill="#34d399" opacity=".85">Оплата подтверждена · баланс активен</text>
  </g>

  <!-- Разделительная линия внизу -->
  <rect x="620" y="526" width="360" height="2" rx="1" fill="url(#glowLine)"/>
</svg>
