<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b0a"/>
      <stop offset="1" stop-color="#0a1411"/>
    </linearGradient>
    <radialGradient id="glowMain" cx="160" cy="-60" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(16,185,129,0.20)"/>
      <stop offset="1" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <radialGradient id="glowPhone" cx="950" cy="280" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(16,185,129,0.14)"/>
      <stop offset="1" stop-color="rgba(16,185,129,0)"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181c1a"/>
      <stop offset="1" stop-color="#0b0e0d"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1210"/>
      <stop offset="1" stop-color="#090d0b"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(16,185,129,0)"/>
      <stop offset="0.5" stop-color="rgba(16,185,129,0.35)"/>
      <stop offset="1" stop-color="rgba(16,185,129,0)"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(16,185,129,0.045)" stroke-width="1"/>
    </pattern>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="830" y="80" width="240" height="488" rx="30"/>
    </clipPath>
  </defs>

  <!-- Фон: тёмный градиент + сетка + свечения -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  <circle cx="160" cy="-60" r="540" fill="url(#glowMain)"/>
  <circle cx="950" cy="280" r="500" fill="url(#glowPhone)"/>

  <!-- Частицы -->
  <g fill="#34d399">
    <circle cx="96" cy="92" r="2.6" opacity="0.45"/>
    <circle cx="212" cy="140" r="2" opacity="0.3"/>
    <circle cx="306" cy="64" r="2.6" opacity="0.4"/>
    <circle cx="158" cy="430" r="2" opacity="0.3"/>
    <circle cx="344" cy="486" r="2.6" opacity="0.35"/>
    <circle cx="120" cy="250" r="1.8" opacity="0.3"/>
    <circle cx="830" cy="120" r="2" opacity="0.3"/>
    <circle cx="1110" cy="180" r="2.6" opacity="0.4"/>
    <circle cx="1180" cy="420" r="2" opacity="0.35"/>
    <circle cx="700" cy="520" r="2.4" opacity="0.3"/>
    <circle cx="852" cy="560" r="2.4" opacity="0.4"/>
    <circle cx="1096" cy="560" r="2.6" opacity="0.35"/>
    <circle cx="640" cy="120" r="2" opacity="0.25"/>
  </g>
  <g filter="url(#softBlur)" opacity="0.5">
    <circle cx="90" cy="90" r="6" fill="#34d399"/>
    <circle cx="1108" cy="178" r="7" fill="#10b981"/>
  </g>

  <!-- Левая колонка -->
  <g>
    <rect x="70" y="150" width="238" height="38" rx="19" fill="rgba(16,185,129,0.12)" stroke="rgba(52,211,153,0.35)" stroke-width="1"/>
    <circle cx="92" cy="169" r="5" fill="#34d399"/>
    <circle cx="92" cy="169" r="10" fill="none" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
    <text x="112" y="175" font-size="15" font-weight="600" fill="#6ee7b7">Виртуальные номера</text>
  </g>

  <text x="70" y="254" font-size="66" font-weight="800" letter-spacing="-1">
    <tspan fill="#f8fafc">SMS </tspan>
    <tspan fill="url(#titleGrad)">Light</tspan>
  </text>

  <text x="72" y="304" font-size="28" font-weight="600" fill="#e5e7eb">Виртуальные номера — моментально</text>

  <text x="72" y="342" font-size="16.5" fill="#9ca3af">Регистрация в Telegram, WhatsApp, Instagram и ещё 200+ сервисах.</text>

  <g font-size="15" fill="#f3f4f6">
    <rect x="72" y="378" width="152" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
    <text x="148" y="406" text-anchor="middle">⚡ Моментально</text>
    <rect x="236" y="378" width="140" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
    <text x="306" y="406" text-anchor="middle">🛡️ Анонимно</text>
    <rect x="388" y="378" width="132" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
    <text x="454" y="406" text-anchor="middle">🌍 30+ стран</text>
  </g>

  <text x="72" y="486" font-size="16" font-weight="500" fill="#34d399">⬇️ Нажмите кнопку «Открыть мини-маркет» ниже</text>

  <!-- Телефон -->
  <g>
    <rect x="815" y="48" width="270" height="534" rx="42" fill="url(#phoneGrad)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" filter="url(#phoneShadow)"/>
    <rect x="806" y="150" width="9" height="26" rx="4.5" fill="rgba(255,255,255,0.14)"/>
    <rect x="806" y="196" width="9" height="36" rx="4.5" fill="rgba(255,255,255,0.14)"/>
    <rect x="1085" y="170" width="9" height="44" rx="4.5" fill="rgba(255,255,255,0.14)"/>
    <rect x="902" y="66" width="96" height="20" rx="10" fill="#060909"/>
    <g clip-path="url(#screenClip)">
      <rect x="830" y="80" width="240" height="488" fill="url(#screenBg)"/>
      <rect x="830" y="80" width="240" height="48" fill="rgba(0,0,0,0.35)"/>
      <circle cx="852" cy="104" r="4" fill="#34d399"/>
      <text x="864" y="109" font-size="13" font-weight="700" fill="#f8fafc">SMS Light</text>
      <text x="1052" y="108" font-size="11" fill="#6ee7b7" text-anchor="end">онлайн</text>

      <rect x="846" y="152" width="180" height="42" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.06)"/>
      <text x="858" y="169" font-size="10.5" fill="#9ca3af">Номер готов:</text>
      <text x="858" y="186" font-size="12.5" font-weight="600" fill="#f8fafc">+7 999 123-45-67</text>

      <rect x="872" y="216" width="174" height="40" rx="14" fill="rgba(16,185,129,0.14)" stroke="rgba(52,211,153,0.28)"/>
      <text x="884" y="241" font-size="11.5" fill="#a7f3d0">Ожидаем SMS с кодом…</text>

      <rect x="860" y="278" width="180" height="70" rx="16" fill="#0a0f0d" stroke="rgba(52,211,153,0.45)" stroke-width="1.5"/>
      <text x="950" y="302" font-size="9.5" letter-spacing="2" fill="#34d399" text-anchor="middle">КОД ПОДТВЕРЖДЕНИЯ</text>
      <text x="950" y="334" font-size="26" font-weight="800" letter-spacing="8" fill="#6ee7b7" text-anchor="middle">4 3 2 1</text>

      <rect x="846" y="368" width="170" height="40" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(52,211,153,0.30)"/>
      <text x="858" y="394" font-size="11.5" fill="#6ee7b7">✅ Готово! Код получен</text>

      <rect x="846" y="430" width="196" height="58" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.06)"/>
      <text x="860" y="452" font-size="11.5" font-weight="700" fill="#f8fafc">SMS Light</text>
      <text x="860" y="472" font-size="10.5" fill="#9ca3af">Ваш код подтверждения: 4 3 2 1</text>

      <rect x="830" y="540" width="240" height="28" fill="rgba(0,0,0,0.30)"/>
      <text x="950" y="558" font-size="10.5" fill="#9ca3af" text-anchor="middle">Оплата подтверждена ✓</text>
    </g>
  </g>

  <rect x="0" y="628" width="1200" height="2" fill="url(#bottomLine)"/>
</svg>
