<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Мини-маркет — SMS Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/data.js"></script>
<style>
  :root {
    --green-300: #6ee7b7;
    --green-400: #34d399;
    --green-500: #10b981;
    --green-600: #059669;
    --green-subtle: rgba(16, 185, 129, 0.08);
    --bg: #080a0a;
    --bg-2: #0c0e0e;
    --bg-3: #101212;
    --card: #0e1010;
    --card-border: #222424;
    --gray-800: #202222;
    --gray-700: #353737;
    --gray-500: #636565;
    --gray-400: #818383;
    --gray-300: #9fa1a1;
    --gray-200: #bdbebe;
    --gray-100: #d8d9d9;
    --white: #eef0f0;
    --red: #ef4444;
    --yellow: #eab308;
    --radius: 12px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--white); font-family: var(--font); }
  body { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ===== App container ===== */
  .ms-app { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; }

  /* ===== Header ===== */
  .ms-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .ms-brand { display: flex; align-items: center; gap: 10px; }
  .ms-brand__logo {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--green-500), var(--green-600));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
  }
  .ms-brand__name { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }
  .ms-brand__sub { font-size: 12px; color: var(--gray-300); margin-top: 1px; }
  .ms-orders-btn {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 9px 12px; font-size: 13px; font-weight: 600; color: var(--gray-100);
    display: flex; align-items: center; gap: 6px; transition: 0.15s ease;
  }
  .ms-orders-btn:active { background: var(--bg-3); }
  .ms-orders-count {
    background: var(--green-500); color: #04120c; font-size: 11px; font-weight: 800;
    min-width: 18px; height: 18px; border-radius: 9px; display: none; align-items: center; justify-content: center; padding: 0 5px;
  }
  .ms-orders-count--on { display: inline-flex; }

  /* ===== Demo banner ===== */
  .ms-banner {
    background: rgba(234, 179, 8, 0.08); border: 1px solid rgba(234, 179, 8, 0.25);
    color: #fde68a; font-size: 12.5px; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.45;
  }

  /* ===== Search ===== */
  .ms-search { margin-bottom: 12px; }
  .ms-search input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--card-border);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--white);
    font-family: inherit; outline: none; transition: border-color 0.15s ease;
  }
  .ms-search input:focus { border-color: var(--green-600); }
  .ms-search input::placeholder { color: var(--gray-500); }

  /* ===== Categories ===== */
  .ms-cats {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .ms-cats::-webkit-scrollbar { display: none; }
  .ms-chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--card); border: 1px solid var(--card-border); color: var(--gray-300);
    white-space: nowrap; transition: 0.15s ease;
  }
  .ms-chip:active { opacity: 0.8; }
  .ms-chip--active { background: var(--green-subtle); border-color: var(--green-600); color: var(--green-300); }

  /* ===== Grid ===== */
  .ms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ms-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    transition: 0.15s ease; text-align: left;
  }
  .ms-card:active { transform: scale(0.97); border-color: var(--green-700); }
  .ms-card__logo {
    width: 42px; height: 42px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(16,185,129,0.06));
    border: 1px solid rgba(16,185,129,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: var(--green-400); letter-spacing: 0.5px;
  }
  .ms-card__name { font-size: 13.5px; font-weight: 600; color: var(--white); line-height: 1.3; flex: 1; }
  .ms-card__price { font-size: 13px; font-weight: 700; color: var(--green-400); }
  .ms-card__price small { font-weight: 500; color: var(--gray-500); }

  /* ===== Empty ===== */
  .ms-empty { text-align: center; color: var(--gray-500); font-size: 14px; padding: 40px 0; }

  /* ===== Screen (orders) ===== */
  .ms-screen { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; }
  .ms-screen__title { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
  .ms-order {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px;
  }
  .ms-order__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ms-order__service { font-size: 15px; font-weight: 700; }
  .ms-order__meta { font-size: 12.5px; color: var(--gray-300); margin-top: 4px; line-height: 1.5; }
  .ms-order__price { font-size: 14px; font-weight: 800; color: var(--green-400); white-space: nowrap; }
  .ms-order__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-border); }
  .ms-order__phone { font-size: 13.5px; color: var(--gray-100); }
  .ms-order__phone b { color: var(--green-400); }
  .ms-order__cancel { font-size: 12.5px; color: var(--red); font-weight: 600; padding: 4px 0; }
  .ms-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; display: inline-block; }
  .ms-status--pending { background: rgba(234,179,8,0.1); color: var(--yellow); }
  .ms-status--completed { background: rgba(16,185,129,0.12); color: var(--green-400); }
  .ms-status--rejected { background: rgba(239,68,68,0.12); color: #f87171; }

  /* ===== Bottom sheet ===== */
  .ms-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .ms-overlay--open { opacity: 1; pointer-events: auto; }
  .ms-sheet {
    background: var(--bg-2); border: 1px solid var(--card-border); border-bottom: none;
    border-radius: 18px 18px 0 0; max-width: 640px; width: 100%;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 88vh; overflow-y: auto;
  }
  .ms-overlay--open .ms-sheet { transform: translateY(0); }
  .ms-sheet__handle { width: 40px; height: 4px; border-radius: 2px; background: var(--gray-700); margin: 0 auto 14px; }
  .ms-sheet__service { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ms-sheet__logo {
    width: 48px; height: 48px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(16,185,129,0.06));
    border: 1px solid rgba(16,185,129,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: var(--green-400);
  }
  .ms-sheet__name { font-size: 16px; font-weight: 800; }
  .ms-sheet__price { font-size: 13.5px; color: var(--green-400); font-weight: 700; margin-top: 2px; }

  .ms-field { margin-bottom: 14px; }
  .ms-field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-300); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  .ms-field select {
    width: 100%; background: var(--bg-3); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; color: var(--white); font-family: inherit; outline: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239fa1a1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center;
  }
  .ms-field select:focus { border-color: var(--green-600); }

  .ms-btn {
    width: 100%; background: linear-gradient(135deg, var(--green-500), var(--green-600));
    color: #04120c; font-weight: 800; font-size: 15px; border-radius: 11px; padding: 14px;
    transition: 0.15s ease; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
  }
  .ms-btn:active { transform: scale(0.98); }
  .ms-btn:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; }
  .ms-btn--ghost {
    background: var(--bg-3); color: var(--gray-100); border: 1px solid var(--card-border);
    box-shadow: none; margin-top: 8px;
  }

  .ms-success { text-align: center; padding: 8px 0 4px; }
  .ms-success__icon { font-size: 44px; margin-bottom: 8px; }
  .ms-success__title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .ms-success__text { font-size: 13.5px; color: var(--gray-200); line-height: 1.55; }
  .ms-success__text b { color: var(--green-400); }
  .ms-success__steps { text-align: left; font-size: 13px; color: var(--gray-200); line-height: 1.7; background: var(--bg-3); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; margin: 12px 0 4px; }
  .ms-success__steps span { color: var(--green-400); font-weight: 800; }

  .ms-hint { font-size: 12.5px; color: var(--gray-400); text-align: center; margin-top: 10px; line-height: 1.5; }

  /* ===== Toast ===== */
  .ms-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
    background: var(--gray-800); color: var(--white); font-size: 13.5px; font-weight: 600;
    padding: 11px 18px; border-radius: 10px; z-index: 100; opacity: 0; transition: 0.25s ease;
    max-width: 90vw; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .ms-toast--on { transform: translateX(-50%) translateY(0); opacity: 1; }
  .ms-toast--err { background: #3f1d1d; color: #fca5a5; }
</style>
</head>
<body>

<div id="app" class="ms-app">
  <header class="ms-header">
    <div class="ms-brand">
      <span class="ms-brand__logo">📲</span>
      <div>
        <div class="ms-brand__name">SMS Light</div>
        <div class="ms-brand__sub">Виртуальные номера</div>
      </div>
    </div>
    <button class="ms-orders-btn" onclick="Shop.toggleOrders()">
      📋 Мои заказы <span id="ordersCount" class="ms-orders-count"></span>
    </button>
  </header>

  <div id="msBanner" class="ms-banner" style="display:none"></div>

  <div class="ms-search">
    <input id="msSearch" type="search" placeholder="Поиск сервиса…" autocomplete="off" oninput="Shop.applyFilters()">
  </div>

  <div id="msCats" class="ms-cats"></div>
  <div id="msGrid" class="ms-grid"></div>
  <div id="msEmpty" class="ms-empty" style="display:none">Ничего не найдено 🙁</div>
</div>

<!-- Orders screen -->
<div id="ordersScreen" class="ms-screen" style="display:none">
  <div class="ms-screen__title">📋 Мои заказы</div>
  <div id="ordersList"></div>
</div>

<!-- Bottom sheet -->
<div id="orderOverlay" class="ms-overlay" onclick="if(event.target===this)Shop.closeSheet()">
  <div class="ms-sheet">
    <div class="ms-sheet__handle"></div>
    <div id="msSheetBody"></div>
  </div>
</div>

<div id="toast" class="ms-toast"></div>

<script>
window.Shop = (function() {
  'use strict';

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  var session = null;
  var authed = false;
  var cat = '';
  var orders = [];

  var SUPPORT = 'REXNCER';

  // ===== Telegram WebApp =====
  function initTg() {
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#080a0a');
      tg.setBackgroundColor('#080a0a');
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    } catch (e) {}
  }

  function haptic(type) {
    if (!tg || !tg.HapticFeedback) return;
    try { tg.HapticFeedback.impactOccurred(type || 'light'); } catch (e) {}
  }

  function setBackButton(show, fn) {
    if (!tg || !tg.BackButton) return;
    try {
      if (show) { tg.BackButton.onClick(fn); tg.BackButton.show(); }
      else { tg.BackButton.offClick(fn); tg.BackButton.hide(); }
    } catch (e) {}
  }

  // ===== Auth через Telegram initData =====
  function initAuth() {
    var initData = (tg && tg.initData) || '';
    if (!initData) {
      showBanner('Демо-просмотр. Чтобы заказывать, откройте маркет через бота в Telegram.');
      return Promise.resolve(false);
    }
    return fetch('/api/tg/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.ok) {
          session = data.user;
          authed = true;
          loadOrders();
          return true;
        }
        showBanner('Не удалось войти в Telegram. Откройте маркет через бота.');
        return false;
      })
      .catch(function() { showBanner('Сервер недоступен. Попробуйте позже.'); return false; });
  }

  function showBanner(text) {
    var el = document.getElementById('msBanner');
    if (!el) return;
    el.textContent = text;
    el.style.display = 'block';
  }

  // ===== Категории =====
  function renderCats() {
    var el = document.getElementById('msCats');
    var cats = Data.getCategories().sort(function(a, b) { return a.localeCompare(b, 'ru'); });
    var html = '<button class="ms-chip' + (cat === '' ? ' ms-chip--active' : '') + '" onclick="Shop.setCat(\'\')">Все</button>';
    for (var i = 0; i < cats.length; i++) {
      html += '<button class="ms-chip' + (cat === cats[i] ? ' ms-chip--active' : '') + '" onclick="Shop.setCat(\'' + cats[i].replace(/'/g, '\\\'') + '\')">' + esc(cats[i]) + '</button>';
    }
    el.innerHTML = html;
  }

  // ===== Каталог =====
  function applyFilters() {
    var q = (document.getElementById('msSearch').value || '').trim().toLowerCase();
    var services = Data.getServices(cat || null);
    var items = [];
    for (var i = 0; i < services.length; i++) {
      var s = services[i];
      if (q && s.name.toLowerCase().indexOf(q) === -1) continue;
      items.push(s);
    }
    items.sort(function(a, b) { return String(a.name).localeCompare(String(b.name), 'ru'); });

    var grid = document.getElementById('msGrid');
    var empty = document.getElementById('msEmpty');
    var html = '';
    for (var j = 0; j < items.length; j++) {
      var sv = items[j];
      html +=
        '<button class="ms-card" onclick="Shop.openOrder(\'' + sv.id + '\')">' +
          '<span class="ms-card__logo">' + logo(sv.id) + '</span>' +
          '<span class="ms-card__name">' + esc(sv.name) + '</span>' +
          '<span class="ms-card__price">' + fmtPrice(sv.price) + '</span>' +
        '</button>';
    }
    grid.innerHTML = html;
    empty.style.display = items.length ? 'none' : 'block';
  }

  function logo(id) {
    var map = {
      telegram:'TG', whatsapp:'WA', viber:'VB', discord:'DC', signal:'SG',
      wechat:'WC', line:'LN', skype:'SK', instagram:'IG', facebook:'FB',
      'x-twitter':'X', tiktok:'TK', snapchat:'SC', linkedin:'LI',
      pinterest:'PI', binance:'BN', bybit:'BB', huobi:'HB', okx:'OK',
      coinbase:'CB', kraken:'KR', gateio:'GT', kucoin:'KC', mexc:'MX',
      sberbank:'SB', tinkoff:'TB', raiffeisen:'RZ', paypal:'PP', wise:'WS',
      revolut:'RV', webmoney:'WM', qiwi:'QI', yoomoney:'YM', netflix:'NF',
      spotify:'SF', twitch:'TW', steam:'SM', 'epic-games':'EG', xbox:'XB',
      playstation:'PS', 'riot-games':'RG', minecraft:'MC', pubg:'PG',
      avito:'AV', olx:'OX', google:'GO', microsoft:'MS', apple:'AP',
      aliexpress:'AX', alibaba:'AL', ebay:'EB', fiverr:'FV', vk:'VK',
      wargaming:'WG', youtube:'YT', chatgpt:'CH', 'battle-net':'BA',
      tinder:'TD', 'plenty-of-fish':'PF', okcupid:'OC', mamba:'MB',
      skout:'SO', happn:'HP', hinge:'HI', bumble:'BU', gett:'GE',
      uber:'UB', bolt:'BT', airbnb:'AB', booking:'BC', wolt:'WL',
      glovo:'GL', foodpanda:'FP', dhl:'DH', doordash:'DD', ebay:'EB'
    };
    return map[id] || (id.charAt(0).toUpperCase() + id.charAt(1).toUpperCase());
  }

  function fmtPrice(price) {
    return price + ' ₽';
  }

  // ===== Оформление заказа =====
  function openOrder(id) {
    var sv = Data.getService(id);
    if (!sv) return;
    var countries = Data.getCountries();
    var options = '';
    for (var i = 0; i < countries.length; i++) {
      var c = countries[i];
      var iso = Data.getCountryIso(c.name);
      var flag = iso ? c.flag : '🌍';
      options += '<option value="' + c.name.replace(/"/g, '&quot;') + '">' + flag + ' ' + esc(c.name) + ' (' + c.code + ')</option>';
    }

    var body = document.getElementById('msSheetBody');
    body.innerHTML =
      '<div class="ms-sheet__service">' +
        '<span class="ms-sheet__logo">' + logo(sv.id) + '</span>' +
        '<div>' +
          '<div class="ms-sheet__name">' + esc(sv.name) + '</div>' +
          '<div class="ms-sheet__price">' + fmtPrice(sv.price) + ' · Виртуальный номер</div>' +
        '</div>' +
      '</div>' +
      '<div class="ms-field">' +
        '<label for="msCountry">Страна</label>' +
        '<select id="msCountry">' + options + '</select>' +
      '</div>' +
      '<button class="ms-btn" id="msBuyBtn" onclick="Shop.submitOrder(\'' + sv.id + '\')">Оформить заказ</button>' +
      (authed ? '' : '<div class="ms-hint">Доступно только при открытии через бота Telegram</div>');

    document.getElementById('orderOverlay').classList.add('ms-overlay--open');
    if (!authed) document.getElementById('msBuyBtn').disabled = true;
  }

  function submitOrder(id) {
    if (!authed || !session) { toast('Откройте маркет через бота Telegram', true); return; }
    var sv = Data.getService(id);
    var country = document.getElementById('msCountry').value;
    if (!sv || !country) return;

    haptic('medium');

    // Заказ без списания баланса — оплата подтверждается вручную
    var p = Data.createPurchase(session.id, 'virtual', sv.name, country, sv.price, 'RUB');

    // Уведомляем администратора в чате (как на сайте)
    notifyAdminOfPurchase(sv.name, country, sv.price);
    loadOrders();

    var body = document.getElementById('msSheetBody');
    body.innerHTML =
      '<div class="ms-success">' +
        '<div class="ms-success__icon">✅</div>' +
        '<div class="ms-success__title">Заказ №' + p.id + ' создан</div>' +
        '<div class="ms-success__text">Сервис: <b>' + esc(sv.name) + '</b> · ' + esc(country) + ' · <b>' + fmtPrice(sv.price) + '</b></div>' +
        '<div class="ms-success__steps">' +
          '<div><span>1.</span> Переведите <b>' + fmtPrice(sv.price) + '</b> на аккаунт <b>@' + SUPPORT + '</b>.</div>' +
          '<div><span>2.</span> В комментарии к переводу укажите <b>№' + p.id + '</b>.</div>' +
          '<div><span>3.</span> Пришлите скриншот оплаты в чат с ботом.</div>' +
          '<div><span>4.</span> Номер появится в «Моих заказах» после подтверждения.</div>' +
        '</div>' +
        '<button class="ms-btn" onclick="Shop.closeSheet(); Shop.toggleOrders()">📋 Мои заказы</button>' +
        '<button class="ms-btn ms-btn--ghost" onclick="Shop.closeSheet()">Продолжить покупки</button>' +
      '</div>';
    toast('Заказ №' + p.id + ' создан');
  }

  function notifyAdminOfPurchase(serviceName, country, price) {
    fetch('/api/users')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var users = (data && data.users) || [];
        var admin = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i] && users[i].is_admin) { admin = users[i]; break; }
        }
        if (!admin || !session) return;
        return fetch('/api/messages/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: Date.now() + Math.floor(Math.random() * 1000),
            senderId: session.id,
            senderName: session.name,
            receiverId: admin.id,
            receiverName: 'SMS Light',
            text: '🛒 Заказ из Telegram: ' + serviceName + ', ' + country + ' — ' + price + ' ₽',
            created_at: new Date().toISOString(),
            read: false
          })
        });
      })
      .catch(function() {});
  }

  // ===== Мои заказы =====
  function loadOrders() {
    return fetch('/api/purchases')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        orders = (data && data.purchases) || [];
        renderOrdersCount();
        return orders;
      })
      .catch(function() { return orders; });
  }

  function renderOrdersCount() {
    var el = document.getElementById('ordersCount');
    var active = orders.filter(function(o) { return o.status === 'pending'; }).length;
    el.textContent = active;
    el.classList.toggle('ms-orders-count--on', active > 0);
  }

  function toggleOrders() {
    var scr = document.getElementById('ordersScreen');
    var app = document.getElementById('app');
    var showing = scr.style.display !== 'none';
    if (showing) {
      scr.style.display = 'none';
      app.style.display = 'block';
      setBackButton(false, backToApp);
      return;
    }
    app.style.display = 'none';
    scr.style.display = 'block';
    setBackButton(true, backToApp);
    loadOrders().then(renderOrders);
  }

  function backToApp() {
    document.getElementById('ordersScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    setBackButton(false, backToApp);
  }

  function renderOrders() {
    var el = document.getElementById('ordersList');
    if (!orders.length) {
      el.innerHTML = '<div class="ms-empty">Заказов пока нет. Выберите сервис выше 👆</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      var badge = '';
      if (o.status === 'pending') badge = '<span class="ms-status ms-status--pending">🟡 Ожидает подтверждения</span>';
      else if (o.status === 'completed') badge = '<span class="ms-status ms-status--completed">✅ Выполнен</span>';
      else badge = '<span class="ms-status ms-status--rejected">🔴 Отменён</span>';

      var phone = (o.status === 'completed' && o.phoneNumber)
        ? '<div class="ms-order__phone">Номер: <b>+' + esc(o.phoneNumber) + '</b> <span style="cursor:pointer;color:var(--green-400);font-weight:700" onclick="Shop.copyPhone(\'' + escAttr(o.phoneNumber) + '\')">копировать</span></div>'
        : '';

      html +=
        '<div class="ms-order">' +
          '<div class="ms-order__head">' +
            '<div>' +
              '<div class="ms-order__service">' + esc(o.serviceName) + '</div>' +
              '<div class="ms-order__meta">' + esc(o.country || '—') + ' · №' + o.id + ' · ' + fmtDate(o.created_at) + '</div>' +
            '</div>' +
            '<div class="ms-order__price">' + fmtPrice(o.price) + '</div>' +
          '</div>' +
          '<div class="ms-order__foot">' + badge +
            (o.status === 'pending'
              ? '<button class="ms-order__cancel" onclick="Shop.cancelOrder(' + o.id + ')">Отменить</button>'
              : '') +
          '</div>' +
          phone +
        '</div>';
    }
    el.innerHTML = html;
  }

  function cancelOrder(id) {
    fetch('/api/purchases/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, status: 'rejected' })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.ok) { toast('Заказ отменён'); loadOrders().then(renderOrders); }
        else toast((data && data.error) || 'Ошибка', true);
      })
      .catch(function() { toast('Ошибка сети', true); });
  }

  function copyPhone(phone) {
    var text = '+' + phone;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { toast('Номер скопирован: ' + text); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Номер скопирован: ' + text); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  // ===== Sheet =====
  function closeSheet() {
    document.getElementById('orderOverlay').classList.remove('ms-overlay--open');
  }

  // ===== Utilities =====
  function esc(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str == null ? '' : String(str)));
    return d.innerHTML;
  }
  function escAttr(str) {
    return String(str).replace(/'/g, '\\\'');
  }
  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  var toastTimer = null;
  function toast(text, isErr) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.className = 'ms-toast ms-toast--on' + (isErr ? ' ms-toast--err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.className = 'ms-toast'; }, 2200);
  }

  // ===== Init =====
  function init() {
    initTg();
    renderCats();
    applyFilters();
    initAuth();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    setCat: function(c) { cat = c; renderCats(); applyFilters(); },
    applyFilters: applyFilters,
    openOrder: openOrder,
    submitOrder: submitOrder,
    closeSheet: closeSheet,
    toggleOrders: toggleOrders,
    cancelOrder: cancelOrder,
    copyPhone: copyPhone
  };
})();
</script>
</body>
</html>
